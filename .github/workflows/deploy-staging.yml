name: Deploy Staging Theme

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/papetarie-storefront/**'
      - 'tools/deploy-staging.ps1'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy theme to staging
        shell: powershell
        env:
          STAGING_FTP_HOST: ${{ secrets.STAGING_FTP_HOST }}
          STAGING_FTP_USER: ${{ secrets.STAGING_FTP_USER }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\tools\deploy-staging.ps1
